version: 2
before:
  hooks:
    - go mod download
env:
  - CGO_ENABLED=0
  - GOPROXY=https://proxy.golang.org
  - DOCKER_GITHUB_REPO=ghcr.io/project0/external-dns-libdns-webhook
project_name: external-dns-libdns-webhook

builds:
  - id: builds
    goos:
      - linux
    goarch:
      - amd64
      - arm64

    main: main.go

snapshot:
  # snapshot images are built per platform (tag suffix -amd64/-arm64), loaded locally, never pushed
  version_template: "{{ incpatch .Version }}-next"

dockers_v2:
  - images:
      - "{{ .Env.DOCKER_GITHUB_REPO }}"
    tags:
      - "{{ .Version }}"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/project0/external-dns-libdns-webhook"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
    - '^docs'
    - '^test'
    - '^chore'
    - Merge pull request
    - Merge remote-tracking branch
    - Merge branch
    - go mod tidy
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other work
      order: 999
release:
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
  footer: |
    **Full Changelog**: https://github.com/project0/external-dns-libdns-webhook/compare/{{ .PreviousTag }}...{{ .Tag }}